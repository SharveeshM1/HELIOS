apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: helios-secrets
  namespace: helios
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: production-secret-store
    kind: ClusterSecretStore
  target:
    name: helios-secrets
    creationPolicy: Owner
  data:
    - secretKey: HELIOS_AUTH_SECRET
      remoteRef:
        key: helios/auth-secret
    - secretKey: HELIOS_ADMIN_PASSWORD
      remoteRef:
        key: helios/admin-password
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: helios/openai-api-key
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: helios/gemini-api-key
    - secretKey: HELIOS_DATABASE_URL
      remoteRef:
        key: helios/database-url
    - secretKey: HELIOS_VECTOR_DATABASE_URL
      remoteRef:
        key: helios/vector-database-url
    - secretKey: HELIOS_PLUGIN_SIGNING_KEY
      remoteRef:
        key: helios/plugin-signing-key
